{% set name = "spacy-transformers" %}
{% set module_name = "spacy_transformers" %}
{% set version = "1.4.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # Upstream tags 1.4.0 as `release-v1.4.0` (not `v1.4.0` like prior 1.3.x releases).
  url: https://github.com/explosion/{{ name }}/archive/refs/tags/release-v{{ version }}.tar.gz
  sha256: 76b8db7025c4c889b986fed594e47ff990df9235651d2de5dc3090618ac509de

build:
  number: 0
  # spacy isn't available on s390x.
  skip: True  # [s390x or py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  build:
    - {{ compiler('cxx') }}
  host:
    - python
    - cython >=0.25
    - numpy {{ numpy }}
    - pip
    - setuptools
    - wheel
  run:
    - python
    - {{ pin_compatible('numpy') }}
    - spacy >=3.5.0,<4.1.0
    - transformers >=3.4.0,<4.53.3
    - pytorch >=1.8.0
    - srsly >=2.4.0,<3.0.0
    - spacy-alignments >=0.7.2,<1.0.0

test:
  requires:
    - pip
    - pytest >=5.2.0
    # test_pipeline_component.py::test_transformer_sentencepiece_IO:
    # XLMRobertaTokenizer requires the SentencePiece library
    - sentencepiece
  imports:
    - {{ module_name }}
  commands:
    - pip check
    # tests take too long (hours) on ppc64le and aarch64
    - python -m pytest --tb=native --pyargs {{ module_name }}  # [not (linux and aarch64)]

about:
  home: https://spacy.io
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Use pretrained transformers like BERT, XLNet and GPT-2 in spaCy
  description: |
    This package provides spaCy components and architectures to use transformer
    models via Hugging Face's transformers in spaCy. The result is convenient
    access to state-of-the-art transformer architectures, such as BERT, GPT-2,
    XLNet, etc.
  doc_url: https://spacy.io/usage/embeddings-transformers
  dev_url: https://github.com/explosion/spacy-transformers

extra:
  recipe-maintainers:
    - honnibal
    - ines
    - adrianeboyd
  skip-lints:
    - cython_needs_compiler
